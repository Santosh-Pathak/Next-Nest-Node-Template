name: Infra Deployment
on:
  workflow_dispatch:

permissions:
  id-token: write  
  contents: write

env:
  TF_VAR_project_name: ${{ github.event.repository.name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TF_VAR_github_token: ${{ secrets.PAT_TOKEN }}

jobs:
  infra_create_manage:
    name: 'Terraform - Apply'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infra

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: 'Authenticate to Azure'
      uses: azure/login@v1
      with:
        # Replace with your Azure AD app registration (OIDC federated credentials)
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}

    - uses: hashicorp/setup-terraform@v3
      name: setup-terraform

    - name: Initialise terraform backend
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
            git config --global url."https://oauth2:${{ secrets.PAT_TOKEN }}@github.com".insteadOf https://github.com
            terraform init \
              -backend-config="storage_account_name=sttdkopsinfra" \
              -backend-config="container_name=$TF_VAR_project_name" \
              -backend-config="key=terraform.tfstate" \
              -backend-config="access_key=${{ secrets.BACKEND_ACCESS_KEY }}"

    - name: Terraform plan
      id: terraform-plan
      run: terraform plan

    - name: Terraform apply
      id: terraform-apply
      run: terraform apply -auto-approve -no-color

    - name: get-vm-ip
      id: vm-ip
      run: terraform outputs
