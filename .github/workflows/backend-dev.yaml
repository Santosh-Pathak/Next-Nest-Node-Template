name: Backend Deployment - DEV

# Manual only — run after CI is green on the target commit.
on:
  workflow_dispatch:

env:
  HOST: ${{ vars.HOST_NAME_dev }}
  USERNAME: ${{ vars.USER_NAME_dev }}
  PORT: 22

jobs:
  Deployment:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: git-clone
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install package
        run: npm ci --legacy-peer-deps

      - name: Clean from VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ secrets.VM_KEY_dev }}
          port: ${{ env.PORT }}
          script: "bash /home/admin_user/apps/scripts/run-app.sh be clean || true"

      - name: copy file via ssh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ secrets.VM_KEY_dev }}
          port: ${{ env.PORT }}
          source: "backend"
          target: /home/admin_user/apps/

      - name: copy script via ssh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ secrets.VM_KEY_dev }}
          port: ${{ env.PORT }}
          source: scripts/run-app.sh
          target: /home/admin_user/apps/

      - name: Run artifact
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ secrets.VM_KEY_dev }}
          port: ${{ env.PORT }}
          command_timeout: 25s
          script: "/home/admin_user/apps/scripts/run-app.sh  be &"
