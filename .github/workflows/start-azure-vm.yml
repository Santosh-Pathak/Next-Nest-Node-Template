name: Start Azure VM morning

on:
  # schedule:
  #   - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}

jobs:
  start-azure:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check VM state
        run: |
          echo "Checking VM status..."

          vm_status=$(az vm get-instance-view \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "instanceView.statuses[1].displayStatus" -o tsv)

          echo "Current VM state: $vm_status"

          if [[ "$vm_status" == "VM running" || "$vm_status" == "VM Running" ]]; then
            echo "VM already running"
            exit 0
          fi

      - name: Start VM
        run: |
          echo "Starting VM..."
          az vm start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME"
