name: Stop Azure VM night

on:
  # schedule:
  #   - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}

jobs:
  stop-azure:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check VM state
        run: |
          echo "Checking VM status..."

          vm_status=$(az vm get-instance-view \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "instanceView.statuses[1].displayStatus" -o tsv)

          echo "Current VM state: $vm_status"

          if [[ "$vm_status" == "Stopped (deallocated)" ]]; then
            echo "VM already deallocated"
            exit 0
          fi

      - name: Deallocate VM
        run: |
          echo "Stopping VM..."
          az vm deallocate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME"
