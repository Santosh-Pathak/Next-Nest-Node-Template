server {
    listen 80 default_server;

    server_name _;
    location /.well-known {
            alias /tmp/.well-known;
            allow all;
            default_type "text/plain";
            autoindex    on;
        }

    location / {
            return 301 http://$host$request_uri;
    }
}

server {
   listen               443 ssl;
   server_name          energised-earth.tedekstra.com;
   ssl_certificate      /etc/letsencrypt/live/energised-earth.tedekstra.com/fullchain.pem;
   ssl_certificate_key  /etc/letsencrypt/live/energised-earth.tedekstra.com/privkey.pem;

   root /home/admin_user/static/;
   index index.html index.htm index.nginx-debian.html;

   location / {
      try_files $uri $uri/ =404;
   }

   location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
